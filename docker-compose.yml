services:
  backend:
    build:
      context: ./backend
    container_name: insightflow-backend
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    volumes:
      - ./backend/faiss_indexes:/app/faiss_indexes
      - ./backend/temp:/app/temp
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    container_name: insightflow-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped